<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title></title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    background: #000;
    overflow: hidden;
  }
  .bg {
    width: 100%;
    height: 100%;
    background-image: url('images/site.png');
    background-size: cover;      /* fills the screen, cropping edges as needed */
    background-position: center;
    background-repeat: no-repeat;
  }
</style>
</head>
<body>
  <div class="bg"></div>
  <audio id="bgAudio" src="audio/site.mp3" loop preload="auto"></audio>

  <script>
    const audio = document.getElementById('bgAudio');

    function tryPlay() {
      const p = audio.play();
      if (p !== undefined) {
        p.catch(() => {
          // Most browsers block autoplay-with-sound until the user interacts once.
          const resume = () => {
            audio.play();
            window.removeEventListener('click', resume);
            window.removeEventListener('touchstart', resume);
            window.removeEventListener('keydown', resume);
          };
          window.addEventListener('click', resume);
          window.addEventListener('touchstart', resume);
          window.addEventListener('keydown', resume);
        });
      }
    }

    tryPlay();
  </script>
</body>
</html>
