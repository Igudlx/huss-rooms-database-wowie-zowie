<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title></title>
<style>
  html, body {
    margin: 0;
    height: 100%;
    background: #000;
    overflow: hidden;
  }
  .wrap {
    height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .wrap img {
    max-width: 100vw;
    max-height: 100vh;
    object-fit: contain;
    display: block;
  }
  #start-overlay {
    position: fixed;
    inset: 0;
    background: #000;
    color: #eee;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: sans-serif;
    font-size: 1rem;
    letter-spacing: 0.05em;
    cursor: pointer;
    z-index: 10;
  }
</style>
</head>
<body>
  <!-- Browsers block audio autoplay-with-sound until a user gesture, so we
       show a simple click-to-enter overlay that starts playback. -->
  <div id="start-overlay">click to enter</div>

  <div class="wrap">
    <img id="main-image" src="" alt="">
  </div>

  <div id="audio-container" style="display:none"></div>

  <script>
    async function init() {
      let data;
      try {
        const res = await fetch('media.json', { cache: 'no-store' });
        data = await res.json();
      } catch (e) {
        console.error('Failed to load media.json', e);
        return;
      }

      if (data.image) {
        document.getElementById('main-image').src = 'image/' + data.image;
      }

      const container = document.getElementById('audio-container');
      const audioEls = [];
      (data.audio || []).forEach((filename) => {
        const el = document.createElement('audio');
        el.src = 'audio/' + filename;
        el.loop = true;
        el.preload = 'auto';
        container.appendChild(el);
        audioEls.push(el);
      });

      const overlay = document.getElementById('start-overlay');
      overlay.addEventListener('click', () => {
        overlay.remove();
        audioEls.forEach((el) => el.play().catch((err) => console.error('play failed', err)));
      }, { once: true });
    }

    init();
  </script>
</body>
</html>
